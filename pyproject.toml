[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-rag-agent-demo"
version = "0.2.0"
description = "Reproducible LangGraph financial knowledge QA demo (synthetic data)"
requires-python = ">=3.10,<3.14"
dependencies = [
 "langgraph>=0.3,<2", "fastapi>=0.110,<1", "uvicorn>=0.30,<1",
 "httpx>=0.27,<1", "pydantic>=2,<3", "numpy>=1.26,<3",
 "faiss-cpu>=1.8,<2", "pypdf>=5,<7", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["finance_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
